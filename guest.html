<style>
:root{
  --bg:#eef2f7;--bg2:#e4eaf2;--card:#fff;

  --border:rgba(26,37,53,0.1);--text:#1a2535;

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard',-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;}

#errorScreen{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;}

.checkout-title{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--navy);margin-bottom:0.5rem;}
.checkout-desc{font-size:0.85rem;color:var(--muted);line-height:1.6;}

#mainScreen{flex:1;display:none;flex-direction:column;}

.hdr{padding:1.25rem 1.5rem 1rem;display:flex;align-items:flex-end;justify-content:space-between;flex-shrink:0;}
.logo{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--navy);letter-spacing:-0.02em;line-height:1;}
.logo-sub{font-size:0.65rem;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;}

.info-bar{margin:0 1.5rem;background:var(--card);border-radius:12px;padding:0.9rem 1.1rem;border:0.5px solid var(--border);flex-shrink:0;}
.info-waiter{font-size:0.7rem;color:var(--muted);margin-bottom:0.2rem;}
.info-table{font-size:1rem;font-weight:600;color:var(--navy);}

.sent-bar{display:none;margin:0.75rem 1.5rem 0;background:#e8f5ee;border:0.5px solid #b8ddc8;border-radius:10px;padding:0.75rem 1rem;font-size:0.8rem;color:#2d6e4a;align-items:center;gap:0.5rem;flex-shrink:0;}

.main-area{flex:1;display:flex;flex-direction:column;gap:0.6rem;padding:1rem 1.5rem;justify-content:center;}

.action-btn{display:flex;flex-direction:row;align-items:center;gap:1rem;padding:1rem 1.25rem;border-radius:14px;border:none;cursor:pointer;text-align:left;transition:all 0.15s;position:relative;overflow:hidden;}

.action-btn:active{transform:scale(0.98);}
.btn-call{background:var(--card);border:0.5px solid var(--border);}

.btn-booking .btn-title{color:var(--navy);}

.btn{flex:1;padding:0.95rem;border-radius:10px;border:none;font-family:inherit;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.15s;}

#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:8px;padding:0.7rem 1.25rem;font-size:0.82rem;white-space:nowrap;z-index:200;opacity:0;pointer-events:none;transition:opacity 0.25s;}

@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* 웨이터 답장 도착 애니메이션 */
#replyBar.reply-arrive {
  animation: replyArrive 0.42s cubic-bezier(.2,.9,.25,1.25) both, replyGlow 1.15s ease both;
}
#replyBar.reply-blink {
  box-shadow: 0 0 0 3px rgba(58,90,138,0.12), 0 8px 22px rgba(26,37,53,0.14);
}
@keyframes replyArrive {
  0% { opacity: 0; transform: translateY(-14px) scale(0.96); }
  55% { opacity: 1; transform: translateY(3px) scale(1.025); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes replyGlow {
  0% { background:#ffffff; border-color:#3a5a8a; }
  35% { background:#dfeaff; border-color:#6f95cf; }
  100% { background:#e8f0fe; border-color:#b8ccf0; }
}

<script>
let waiterData = null;
let guestData = null;
let guestId = null;
let pendingType = null;
let isActive = true;
let db, fbRef, fbPush, fbGet, fbSet, fbUpdate, fbOnValue, fbRemove;

function _assignFb() {
  db=window._db; fbRef=window._ref; fbPush=window._push;
  fbGet=window._get; fbSet=window._set; fbUpdate=window._update; fbOnValue=window._onValue; fbRemove=window._remove;
}
function waitFb(fn) {
  if (window._fbReady) { _assignFb(); fn(); }
  else document.addEventListener('fb-ready', function(){ _assignFb(); fn(); }, {once:true});
}
// compat SDK는 동기 로드 — DOMContentLoaded 후 바로 init
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function(){ _assignFb(); init(); });
} else {
  _assignFb(); init();
}
function nowStr() { const n=new Date(); return n.getHours()+':'+String(n.getMinutes()).padStart(2,'0'); }
function nowFull() {
  const n=new Date();
  let h=n.getHours();
  if (h < 6) h += 24; // 새벽(0~5시)은 영업일 기준 24~29시로 — 자정 넘어도 정렬 순서 유지
  return String(h).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
}
function todayStr() {
  const n = new Date();
  if (n.getHours() < 6) n.setDate(n.getDate() - 1);
  return n.getFullYear() + "년 " + (n.getMonth()+1) + "월 " + n.getDate() + "일";
}

const processedReplyKeys = new Set();
let replyHideTimer = null;

function showGuestReply(msg) {
  const bar = document.getElementById('replyBar');
  const text = document.getElementById('replyMsg');
  if (!bar || !text) return;

  clearTimeout(replyHideTimer);

  // 같은 문구라도 새 답장이 오면 기존 표시를 완전히 초기화한다.
  text.textContent = '웨이터: ' + msg;
  bar.style.display = 'none';
  bar.classList.remove('reply-arrive', 'reply-blink');

  // 브라우저가 같은 애니메이션을 재사용하지 않도록 강제로 리플로우
  void bar.offsetWidth;

  // 새 메시지가 도착한 것처럼 다시 켜지는 효과
  bar.style.display = 'flex';
  bar.classList.add('reply-arrive', 'reply-blink');

  // 휴대폰에서는 짧게 진동까지 줘서 새 메시지 느낌을 강화
  if (navigator.vibrate) {
    try { navigator.vibrate([80, 40, 80]); } catch(e) {}
  }

  // 애니메이션 클래스는 잠깐 뒤 제거해 다음 답장 때 다시 실행되게 함
  setTimeout(() => {
    bar.classList.remove('reply-arrive', 'reply-blink');
  }, 700);

  replyHideTimer = setTimeout(() => {
    bar.style.display = 'none';
  }, 15000);
}

function handleGuestReply(key, reply, sourcePath) {
  if (!reply || reply.guestId !== guestId || !reply.msg) return;

  // 같은 문구(예: 곧 갈게요)라도 요청/답장마다 새 이벤트로 처리한다.
  // Firebase key가 같아도 sentAt/eventId가 다르면 새 답장으로 다시 띄운다.
  const eventKey = String(key || '') + '_' + String(reply.sentAt || reply.eventId || reply.time || '');
  if (processedReplyKeys.has(eventKey)) return;
  processedReplyKeys.add(eventKey);

  showGuestReply(reply.msg);

  // 처리한 답장은 DB에서 정리해서 새로고침 때 반복 표시되지 않게 함
  if (sourcePath && fbRemove) {
    setTimeout(() => fbRemove(fbRef(db, sourcePath)).catch(() => {}), 500);
  }
}


function init() {
  const params = new URLSearchParams(location.search);
  let wname = params.get('w');
  let savedGuestId = params.get('g');

  // 문자 링크용 wg 파라미터 파싱 (웨이터명|손님ID 형식)
  if (!wname || !savedGuestId) {
    const wg = params.get('wg');
    if (wg) {
      const decoded = decodeURIComponent(wg);
      const pipeIdx = decoded.indexOf('|');
      if (pipeIdx > 0) {
        wname = decoded.substring(0, pipeIdx);
        savedGuestId = decoded.substring(pipeIdx + 1);
      } else {
        // 구버전 호환: - 기준으로 분리
        const dashIdx = decoded.indexOf('-');
        if (dashIdx > 0) {
          wname = decoded.substring(0, dashIdx);
          savedGuestId = decoded.substring(dashIdx);
        }
      }
    }
  }

  // URL 파라미터 없으면 localStorage/sessionStorage에서 복원
  if (!wname || !savedGuestId) {
    const saved = localStorage.getItem('ncall_guest') || sessionStorage.getItem('ncall_guest');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        wname = parsed.w;
        savedGuestId = parsed.g;
      } catch(e) {}
    }
  }

  if (!wname || !savedGuestId) { showError(); return; }

  // localStorage + sessionStorage 둘 다 저장 (PWA/브라우저 분리 대응)
  const guestSaveData = JSON.stringify({ w: wname, g: savedGuestId });
  localStorage.setItem('ncall_guest', guestSaveData);
  try { sessionStorage.setItem('ncall_guest', guestSaveData); } catch(e) {}

  // URL에 파라미터 없으면 복원 (뒤로가기로 파라미터 날아간 경우)
  if (!params.get('w') || !params.get('g')) {
    const newUrl = location.pathname + '?w=' + encodeURIComponent(wname) + '&g=' + savedGuestId;
    history.replaceState(null, '', newUrl);
  }

  // 뒤로가기 막기
  history.pushState(null, '', location.href);
  window.addEventListener('popstate', () => {
    history.pushState(null, '', location.href);
  });

  guestId = savedGuestId;

  // 웨이터 정보 가져오기
  fbGet(fbRef(db, `waiters/${wname}`)).then(wSnap => {
    if (!wSnap.exists()) { showError(); return; }
    waiterData = wSnap.val();

    // 손님 정보 가져오기
    fbGet(fbRef(db, `guests/${waiterData.id}/${guestId}`)).then(gSnap => {
      if (!gSnap.exists() || gSnap.val().active === false) { showError(); return; }
      guestData = gSnap.val();

      document.getElementById('infoWaiter').textContent = wname + ' 웨이터';
      document.getElementById('mainScreen').style.display = 'flex';

      // 입장 기록 — 계산완료 전까지 1회만 (Firebase 기준, 기기/링크 무관)
      const _n = new Date(); if (_n.getHours() < 6) _n.setDate(_n.getDate() - 1);
      const _today = _n.getFullYear() + '-' + String(_n.getMonth()+1).padStart(2,'0') + '-' + String(_n.getDate()).padStart(2,'0');
      // 계산 완료로 링크가 닫힌 손님은 접속 차단 (웨이터가 링크 다시 보내면 해제됨)
      if (guestData.linkClosed === true) {
        document.getElementById('mainScreen').style.display = 'none';
        document.getElementById('checkoutScreen').style.display = 'flex';
        return;
      }
      const _alreadyIn = guestData.visitOpen === true && guestData.lastVisit === _today;
      if (!_alreadyIn) {
        const enterTime = nowStr();
        const enterDate = todayStr();
        fbPush(fbRef(db, 'history/' + waiterData.id), {
          type: 'enter', tableLabel: guestData.label, guestMsg: guestData.label,
          guestId: guestId, waiterName: waiterData.name,
          time: enterTime, date: enterDate, sortKey: nowFull()
        });
        const _upd = { visitOpen: true, lastVisit: _today };
        if (guestData.isDangol) {
          _upd.visitCount = (guestData.visitCount || 0) + 1;
          fbPush(fbRef(db, `guests/${waiterData.id}/${guestId}/visitLog`), {
            date: _today, dateLabel: enterDate, enter: enterTime, exit: null
          });
        }
        fbUpdate(fbRef(db, `guests/${waiterData.id}/${guestId}`), _upd);
      }

      // 웨이터 답장 실시간 감지 — 손님별 전용 경로만 구독 (다른 손님 데이터 안 받음)
      // 같은 문구라도 새 요청의 새 key면 새 메시지처럼 다시 표시하고 15초 타이머를 리셋함
      fbOnValue(fbRef(db, `guestReplies/${waiterData.id}/${guestId}`), snap => {
        const data = snap.val() || {};
        Object.entries(data).forEach(([key, reply]) => {
          handleGuestReply(key, reply, `guestReplies/${waiterData.id}/${guestId}/${key}`);
        });
      });

      // 실시간 계산완료 감지 (일반손님: active=false / 단골: 계산완료로 visitOpen=false)
      let _sawOpen = _alreadyIn;
      fbOnValue(fbRef(db, `guests/${waiterData.id}/${guestId}`), snap => {
        const gd = snap.val();
        if (!gd) return;
        if (gd.visitOpen === true) _sawOpen = true;
        const done = gd.active === false || (gd.isDangol && gd.visitOpen === false && _sawOpen);
        if (done) {
          isActive = false;
          localStorage.removeItem('ncall_guest'); localStorage.removeItem('entered_' + guestId); // 계산 완료 시 저장 데이터 삭제
          document.getElementById('mainScreen').style.display = 'none';
          document.getElementById('checkoutScreen').style.display = 'flex';
        }
      });
    });
  });
}

function showError() {
  document.getElementById('errorScreen').style.display = 'flex';
}

let beerQty = 1;

}
function closeMsgModal() {

}

  closeMsgModal();
  if (!isActive) { toast('이미 계산 완료된 테이블이에요'); return; }
  waitFb(() => {
    const sentTime = nowStr();
    const sentDate = todayStr();
    const sortKey = nowFull();
    fbPush(fbRef(db, `notifs/${waiterData.id}`), {
      type: 'message', tableLabel: guestData.label, guestMsg: guestData.label,
      msgText: text, waiterName: waiterData.name, guestId,
      time: sentTime, date: sentDate, done: false
    }).then(() => {
      const bar = document.getElementById('sentBar');
      document.getElementById('sentMsg').textContent = '메시지가 전송됐어요';
      bar.classList.add('show');
      setTimeout(() => bar.classList.remove('show'), 4000);
      toast('💬 메시지 전송!');
    }).catch(() => {
      toast('전송에 실패했어요. 신호를 확인하고 다시 보내주세요');

    const sentDate = todayStr();
    const sortKey = nowFull();

      type: 'beer', tableLabel: guestData.label, guestMsg: guestData.label,

    }).then(() => {

      bar.classList.add('show');
      setTimeout(() => bar.classList.remove('show'), 4000);

    }).catch(() => {
      toast('전송에 실패했어요. 신호를 확인하고 다시 주문해주세요');
    });

}

/* ── 호출/부킹 연타 방지 (1분 쿨다운) ── */
const COOLDOWN_MS = 60000;
let _cdTimers = {};

function cdKey(type) { return 'ncall_cd_' + type + '_' + (guestId || 'g'); }

function cdRemain(type) {
  try {
    const until = parseInt(localStorage.getItem(cdKey(type)) || '0', 10);
    return Math.max(0, until - Date.now());
  } catch(e) { return 0; }
}

function cdStart(type) {
  try { localStorage.setItem(cdKey(type), String(Date.now() + COOLDOWN_MS)); } catch(e) {}
  cdLockBtn(type);
}

function cdBtnEl(type) {
  return document.querySelector(type === 'call' ? '.btn-call' : '.btn-booking');
}

function cdLockBtn(type) {
  const btn = cdBtnEl(type);
  if (!btn) return;
  const desc = btn.querySelector('.btn-desc');
  if (desc && !desc.dataset.orig) desc.dataset.orig = desc.textContent;
  btn.classList.add('cooldown');
  if (_cdTimers[type]) clearInterval(_cdTimers[type]);
  const tick = () => {
    const remain = cdRemain(type);
    if (remain <= 0) {
      clearInterval(_cdTimers[type]);
      btn.classList.remove('cooldown');
      if (desc && desc.dataset.orig) desc.textContent = desc.dataset.orig;
      return;
    }
    if (desc) desc.textContent = Math.ceil(remain / 1000) + '초 후 다시 가능해요';
  };
  tick();
  _cdTimers[type] = setInterval(tick, 1000);
}

function cdRestoreOnLoad() {
  // 쿨다운 제거됨 — 예전 버전에서 저장된 잠금 기록이 있으면 지워 버튼이 잠기지 않게 함
  ['call', 'booking'].forEach(t => { try { localStorage.removeItem(cdKey(t)); } catch(e) {} });
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', cdRestoreOnLoad);
} else {
  cdRestoreOnLoad();
}

function sendAction(type) {
  pendingType = type;
  document.getElementById('modalIcon').textContent = type==='call' ? '🙋' : '🔔';
  document.getElementById('modalTitle').textContent = type==='call' ? '웨이터 호출' : '부킹 요청';
  document.getElementById('modalSub').textContent = type==='call'
    ? '웨이터를 호출해요'
    : '부킹을 요청해요';
  document.getElementById('confirmBtn').className = 'btn btn-confirm' + (type==='booking' ? ' red' : '');
  document.getElementById('confirmModal').classList.add('open');
}

function closeModal() {
  document.getElementById('confirmModal').classList.remove('open');
}

function doSend() {
  closeModal();
  if (!isActive) { toast('이미 계산 완료된 테이블이에요'); return; }
  const type = pendingType;

  if (!waiterData || !guestId) { toast('연결이 끊겼어요. 다시 접속해주세요.'); return; }
  waitFb(() => {
    // 부킹 요청일 때만 muted 체크
    if (type === 'booking') {
      fbGet(fbRef(db, `guests/${waiterData.id}/${guestId}/muted`)).then(snap => {
        if (snap.val() === true) {
          toast('부킹 요청이 차단된 테이블이에요');
          return;
        }
        sendNotif(type);
      }).catch(() => {
        sendNotif(type);
      });
    } else {
      sendNotif(type);
    }
  });
}

function sendNotif(type) {
  const sentTime = nowStr();
  const sentDate = todayStr();
  fbPush(fbRef(db, `notifs/${waiterData.id}`), {
    type, tableLabel: guestData.label, guestMsg: guestData.label,
    waiterName: waiterData.name, guestId,
    time: sentTime, date: sentDate, done: false
  }).then(() => {
    const bar = document.getElementById('sentBar');
    document.getElementById('sentMsg').textContent = type==='call' ? '호출이 전송됐어요' : '부킹 요청이 전송됐어요';
    bar.classList.add('show');
    setTimeout(() => bar.classList.remove('show'), 4000);
    toast(type==='call' ? '✓ 호출 전송!' : '✓ 부킹 요청 전송!');
  }).catch(() => {
    toast('전송에 실패했어요. 신호를 확인하고 다시 눌러주세요');
  });
}

  document.getElementById('checkoutReqModal').classList.add('open');
}
function closeCheckoutReqModal() {

  waitFb(() => {
    fbPush(fbRef(db, `notifs/${waiterData.id}`), {
      type: 'checkout_req', tableLabel: guestData.label, guestMsg: guestData.label,

    }).then(() => {

      bar.classList.add('show');
      setTimeout(() => bar.classList.remove('show'), 4000);
      toast('🧾 계산 요청 전송!');
    }).catch(() => {
      toast('전송에 실패했어요. 신호를 확인하고 다시 눌러주세요');
    });

let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2000);
}
